name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "feat/**"
      - "fix/**"
      - "hotfix/**"
      - "chore/**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff>=0.3.0

      - name: Check code formatting (Ruff)
        run: ruff format --check .

      - name: Run static analysis linter (Ruff)
        run: ruff check .

  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute pytest test suite
        run: python -m pytest backend/tests -v

  backend-migrations:
    name: Database Migration Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: manta_user
          POSTGRES_PASSWORD: manta_password
          POSTGRES_DB: manta_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -h localhost -p 5432 -U manta_user -d manta_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+asyncpg://manta_user:manta_password@localhost:5432/manta_db
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for PostgreSQL service readiness
        run: python scripts/verify_migrations.py --step wait

      - name: Apply migrations to head (upgrade head)
        run: python scripts/verify_migrations.py --step upgrade

      - name: Revert all migrations to base (downgrade base)
        run: python scripts/verify_migrations.py --step downgrade

      - name: Re-apply migrations to head (upgrade head)
        run: python scripts/verify_migrations.py --step reupgrade

      - name: Check for model/schema drift (alembic check)
        run: python scripts/verify_migrations.py --step check

  backend-docker-build:
    name: Backend Docker Image Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend container image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: manta-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web-checks:
    name: Web Portal Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      ESLINT_USE_FLAT_CONFIG: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Run Next.js lint
        run: npm run lint

      - name: Build Next.js application
        run: npm run build

  ci-gate:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs:
      - backend-lint
      - backend-test
      - backend-migrations
      - backend-docker-build
      - web-checks
    if: always()
    steps:
      - name: Evaluate overall CI pipeline status
        run: |
          echo "Evaluating CI stage results..."
          echo "Backend Lint:         ${{ needs.backend-lint.result }}"
          echo "Backend Test:         ${{ needs.backend-test.result }}"
          echo "Backend Migrations:   ${{ needs.backend-migrations.result }}"
          echo "Backend Docker Build: ${{ needs.backend-docker-build.result }}"
          echo "Web Checks:           ${{ needs.web-checks.result }}"

          if [ "${{ needs.backend-lint.result }}" != "success" ] || \
             [ "${{ needs.backend-test.result }}" != "success" ] || \
             [ "${{ needs.backend-migrations.result }}" != "success" ] || \
             [ "${{ needs.backend-docker-build.result }}" != "success" ] || \
             [ "${{ needs.web-checks.result }}" != "success" ]; then
            echo "CI Pipeline failed: One or more stages failed or were cancelled. Merging is blocked."
            exit 1
          fi

          echo "All stages passed successfully! CI status check is GREEN."
