name: Mobile CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches:
      - main
      - develop
      - mobile
      - "feature/**"
      - "fix/**"
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-ci:
    name: Mobile Quality Checks & Debug Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run code format check (Ktlint)
        run: ./gradlew ktlintCheck --no-daemon

      - name: Run static analysis (Android Lint)
        run: ./gradlew lintDevDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew testDevDebugUnitTest --no-daemon

      - name: Build debug APK (assembleDebug)
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-debug-apk
          path: mobile/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-reports
          path: mobile/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
