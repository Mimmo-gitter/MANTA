services:
  # 1. PostgreSQL 16 with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: manta_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-manta_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manta_password}
      POSTGRES_DB: ${POSTGRES_DB:-manta_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - manta_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manta_user} -d ${POSTGRES_DB:-manta_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. PgBouncer Connection Pooler (transaction pooling + DISCARD ALL)
  # All pooling settings live in infra/pgbouncer/pgbouncer.ini (see docs/pgbouncer.md).
  # DB_USER / DB_PASSWORD / AUTH_TYPE are only used by the image entrypoint to
  # generate userlist.txt at startup, so no credentials are committed to the repo.
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    container_name: manta_pgbouncer
    environment:
      DB_USER: ${POSTGRES_USER:-manta_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-manta_password}
      AUTH_TYPE: scram-sha-256
    volumes:
      - ../infra/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"
    networks:
      - manta_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${POSTGRES_USER:-manta_user} -d ${POSTGRES_DB:-manta_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 3. Redis / Valkey 7 In-Memory Store
  valkey:
    image: valkey/valkey:7-alpine
    container_name: manta_valkey
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - valkeydata:/data
    networks:
      - manta_net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 4. FastAPI Backend Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manta_app
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://manta_user:manta_password@pgbouncer:5432/manta_db}
      - REDIS_URL=${REDIS_URL:-redis://valkey:6379/0}
      - KEYCLOAK_URL=${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-manta}
    ports:
      - "${APP_PORT:-8000}:8000"
    networks:
      - manta_net
    depends_on:
      pgbouncer:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 5. Keycloak Identity Provider (OIDC / OAuth2)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: manta_keycloak
    command:
      - "start-dev"
      - "--import-realm"
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-manta_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-manta_password}
      KC_DB_SCHEMA: ${KEYCLOAK_DB_SCHEMA:-public}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_PORT: 8080
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ../infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - manta_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s


volumes:
  pgdata:
  valkeydata:

networks:
  manta_net:
    driver: bridge
