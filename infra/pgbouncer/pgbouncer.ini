;; =============================================================================
;; MANTA PgBouncer configuration (local development + CI)
;;
;; Architecture §6.4 "PgBouncer Hardening & Connection Pooler State Leakage
;; Prevention". The full rationale for every setting lives in docs/pgbouncer.md.
;;
;; NOTE: PgBouncer does NOT support trailing comments. ";" and "#" are only
;; treated as comments at the start of a line, so keep comments on their own
;; lines or they become part of the value.
;; =============================================================================

[databases]
;; Wildcard entry: forward whatever dbname the client requests to the Postgres
;; service. Keeps this file free of environment-specific database names
;; (POSTGRES_DB is overridable in docker-compose.yml).
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432

;; -----------------------------------------------------------------------------
;; Authentication
;; -----------------------------------------------------------------------------
;; userlist.txt is generated at container start by the edoburu entrypoint from
;; the DB_USER / DB_PASSWORD environment variables, so no credentials are ever
;; committed to the repository.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = manta_user

;; -----------------------------------------------------------------------------
;; Pooling mode & tenant safety
;; -----------------------------------------------------------------------------
;; A physical server connection is bound to a client only for the duration of
;; one transaction, then returned to the pool for any other client/tenant.
pool_mode = transaction

;; Wipes ALL session-level state from a server connection before it is reused:
;; RESET ALL (custom GUCs such as app.current_tenant_id, search_path, role),
;; SET SESSION AUTHORIZATION DEFAULT, DEALLOCATE ALL, CLOSE ALL, UNLISTEN *,
;; pg_advisory_unlock_all(), DISCARD PLANS / TEMP / SEQUENCES.
server_reset_query = DISCARD ALL

;; REQUIRED for the line above to have any effect: by default PgBouncer runs
;; server_reset_query ONLY in session pooling mode and silently skips it in
;; transaction mode. With 1, every client loses its session state after each
;; transaction, deterministically.
server_reset_query_always = 1

;; Protocol-level prepared-statement tracking is disabled: a DISCARD ALL after
;; every transaction would invalidate statements PgBouncer believes are cached.
;; The application disables asyncpg statement caches instead
;; (backend/app/db/session.py).
max_prepared_statements = 0

;; -----------------------------------------------------------------------------
;; Pool sizing (local + CI)
;; -----------------------------------------------------------------------------
;; Postgres runs with the default max_connections = 100. Keycloak connects to
;; Postgres directly, and psql/admin sessions need headroom, so PgBouncer is
;; capped well below that limit.
;;
;; Client side: the app's SQLAlchemy pool (pool_size 10 + max_overflow 20) times
;; a few processes (API, worker, test runner) fits comfortably.
max_client_conn = 200
;; Server connections per (database, user) pair.
default_pool_size = 20
;; Do not hold idle server connections open on laptops / CI runners.
min_pool_size = 0
;; Burst headroom, used only after a client has waited reserve_pool_timeout s.
reserve_pool_size = 5
reserve_pool_timeout = 3
;; Hard cap of server connections per database across all users.
max_db_connections = 30

;; -----------------------------------------------------------------------------
;; Timeouts (fail fast in CI instead of hanging)
;; -----------------------------------------------------------------------------
;; Max seconds a client waits for a free server connection (default 120).
query_wait_timeout = 30
;; Close server connections idle for more than 5 minutes.
server_idle_timeout = 300
server_lifetime = 3600
client_idle_timeout = 0

;; -----------------------------------------------------------------------------
;; Compatibility & observability
;; -----------------------------------------------------------------------------
ignore_startup_parameters = extra_float_digits
;; Read-only console access (SHOW POOLS / SHOW CONFIG) for local verification.
stats_users = manta_user
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
